name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-gen-tag:
    name: Auto Generate Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gen-tag-step.outputs.tagname }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create tag from pubspec version
        id: gen-tag-step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, skipping."
            echo "tagname=" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release ${tag}"
            git push origin "$tag"
            echo "tagname=${tag}" >> "$GITHUB_OUTPUT"
          fi

  generate-changelog:
    if: ${{ startsWith(needs.auto-gen-tag.outputs.tag, 'v') }}
    name: Generate changelog
    needs: auto-gen-tag
    runs-on: ubuntu-latest
    steps:
      - name: Get latest published release tag
        id: get_latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')
          echo "release=${release}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog since last published release
        uses: charmixer/auto-changelog-action@v1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          future_release: ${{ needs.auto-gen-tag.outputs.tag }}
          since_tag: ${{ steps.get_latest_release.outputs.release }}
          release_branch: main
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  create-release:
    name: Draft Github release
    needs: [auto-gen-tag, generate-changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Download changelog
        uses: actions/download-artifact@v5
        with:
          name: changelog
      - name: Create release with changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.auto-gen-tag.outputs.tag }}
          name: Grex DS ${{ needs.auto-gen-tag.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  tests:
    name: Run Automated Tests
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.x'
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  publish:
    name: Upload package to pub.dev
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.x'
      - name: Check Publish Warnings
        run: dart pub publish --dry-run
      - name: Publish
        uses: k-paxian/dart-package-publisher@v.1.6.2
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true
